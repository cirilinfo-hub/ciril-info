name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ciril-info-saas

jobs:
  api:
    name: API · typecheck, unit tests, migrations, seed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cirilinfo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cirilinfo" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      PUBLIC_WEB_URL: http://localhost:4200
      CUSTOMER_PORTAL_URL: http://localhost:4200/portal
      ADMIN_PORTAL_URL: http://localhost:4200/admin
      API_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:4200
      DATABASE_URL: postgresql://cirilinfo_owner:ci_owner@localhost:5432/cirilinfo?schema=public
      DATABASE_URL_APP: postgresql://cirilinfo_app:ci_app@localhost:5432/cirilinfo?schema=public
      DATABASE_URL_PLATFORM: postgresql://cirilinfo_platform:ci_platform@localhost:5432/cirilinfo?schema=public
      REDIS_PASSWORD: unused-in-ci
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SEED_SUPERADMIN_EMAIL: ci-admin@example.test
      SEED_SUPERADMIN_PASSWORD: Ci-Only-Passw0rd!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ciril-info-saas/apps/api/package-lock.json
      - name: Create database roles (same script as production)
        env:
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: cirilinfo
          DB_OWNER_PASSWORD: ci_owner
          DB_APP_PASSWORD: ci_app
          DB_PLATFORM_PASSWORD: ci_platform
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          sed 's/psql -v ON_ERROR_STOP=1/psql -h localhost -v ON_ERROR_STOP=1/' infra/postgres/init/01-roles.sh | bash
      - run: npm ci
        working-directory: ciril-info-saas/apps/api
      - run: npm run typecheck
        working-directory: ciril-info-saas/apps/api
      - run: npm test
        working-directory: ciril-info-saas/apps/api
      - name: Apply migrations (owner role)
        run: npx prisma migrate deploy
        working-directory: ciril-info-saas/apps/api
      - name: Seed twice (must be idempotent; no sample data)
        run: npm run db:seed && npm run db:seed
        working-directory: ciril-info-saas/apps/api
      - name: Production must refuse sample data
        run: |
          if NODE_ENV=production SEED_SAMPLE_DATA=true npm run db:seed; then
            echo "::error::seed accepted sample data in production"; exit 1
          fi
        working-directory: ciril-info-saas/apps/api
      - name: Sample data seeds (twice) and purges completely
        run: |
          SEED_SAMPLE_DATA=true npm run db:seed && SEED_SAMPLE_DATA=true npm run db:seed
          npm run db:purge-samples
          left=$(psql "postgresql://postgres:postgres@localhost:5432/cirilinfo" -tAc \
            "select (select count(*) from plans)+(select count(*) from testimonials)+(select count(*) from faqs)")
          test "$left" = "0" || { echo "::error::$left sample rows left after purge"; exit 1; }
        working-directory: ciril-info-saas/apps/api
      - name: Migrations match schema (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        working-directory: ciril-info-saas/apps/api
      - name: Integration + tenant-isolation tests
        run: npm run test:e2e
        working-directory: ciril-info-saas/apps/api
      - run: npx nest build
        working-directory: ciril-info-saas/apps/api

  web:
    name: Web · build, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ciril-info-saas/apps/web/package-lock.json
      - run: npm ci
        working-directory: ciril-info-saas/apps/web
      - run: npx ng build --configuration production
        working-directory: ciril-info-saas/apps/web
      - run: npx ng test --watch=false
        working-directory: ciril-info-saas/apps/web

  e2e:
    name: E2E · Playwright (desktop, tablet, mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [api, web]
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cirilinfo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cirilinfo" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      NODE_ENV: test
      NG_CLI_ANALYTICS: "false"
      PUBLIC_WEB_URL: http://localhost:4200
      CUSTOMER_PORTAL_URL: http://localhost:4200/portal
      ADMIN_PORTAL_URL: http://localhost:4200/admin
      API_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:4200
      DATABASE_URL: postgresql://cirilinfo_owner:ci_owner@localhost:5432/cirilinfo?schema=public
      DATABASE_URL_APP: postgresql://cirilinfo_app:ci_app@localhost:5432/cirilinfo?schema=public
      DATABASE_URL_PLATFORM: postgresql://cirilinfo_platform:ci_platform@localhost:5432/cirilinfo?schema=public
      REDIS_PASSWORD: unused-in-ci
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      EMAIL_PROVIDER: mailpit
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create database roles
        env:
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: cirilinfo
          DB_OWNER_PASSWORD: ci_owner
          DB_APP_PASSWORD: ci_app
          DB_PLATFORM_PASSWORD: ci_platform
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          sed 's/psql -v ON_ERROR_STOP=1/psql -h localhost -v ON_ERROR_STOP=1/' infra/postgres/init/01-roles.sh | bash
      - name: API (migrate, seed, build)
        working-directory: ciril-info-saas/apps/api
        run: npm ci && npx prisma migrate deploy && npm run db:seed && npx nest build
      - run: npm ci
        working-directory: ciril-info-saas/apps/web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: ciril-info-saas/e2e
      - run: npx playwright test
        working-directory: ciril-info-saas/e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ciril-info-saas/e2e/playwright-report

  security:
    name: Security · dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit (fail on high/critical in runtime deps)
        run: |
          (cd apps/api && npm audit --omit=dev --audit-level=high)
          (cd apps/web && npm audit --omit=dev --audit-level=high)

  docker:
    name: Docker · images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API/worker image
        uses: docker/build-push-action@v6
        with:
          context: ciril-info-saas
          file: ciril-info-saas/infra/docker/api.Dockerfile
          push: false
          tags: cirilinfo/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web/nginx image
        uses: docker/build-push-action@v6
        with:
          context: ciril-info-saas
          file: ciril-info-saas/infra/docker/web.Dockerfile
          push: false
          tags: cirilinfo/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
