# Production stack for the Hostinger VPS (see DEPLOYMENT.md).
#   docker compose --env-file /opt/cirilinfo/.env up -d
# Secrets live ONLY in /opt/cirilinfo/.env on the server (chmod 600), never in Git.
# PostgreSQL and Redis are on the internal network only — no published ports.

name: cirilinfo

x-app-env: &app-env
  NODE_ENV: production
  PUBLIC_WEB_URL: https://cirilinfo.com
  CUSTOMER_PORTAL_URL: https://app.cirilinfo.com
  ADMIN_PORTAL_URL: https://admin.cirilinfo.com
  API_URL: https://api.cirilinfo.com
  API_PORT: "3000"
  CORS_ORIGINS: https://cirilinfo.com,https://app.cirilinfo.com,https://admin.cirilinfo.com
  DATABASE_URL: postgresql://cirilinfo_owner:${DB_OWNER_PASSWORD}@postgres:5432/cirilinfo?schema=public
  DATABASE_URL_APP: postgresql://cirilinfo_app:${DB_APP_PASSWORD}@postgres:5432/cirilinfo?schema=public
  DATABASE_URL_PLATFORM: postgresql://cirilinfo_platform:${DB_PLATFORM_PASSWORD}@postgres:5432/cirilinfo?schema=public
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER}
  EMAIL_FROM: ${EMAIL_FROM}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  AWS_SES_REGION: ${AWS_SES_REGION:-ap-south-1}
  AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:-}
  AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:-}
  AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
  RAZORPAY_SAVED_CARDS: ${RAZORPAY_SAVED_CARDS:-false}
  CARD_AUTOPAY_MAX_AMOUNT: ${CARD_AUTOPAY_MAX_AMOUNT:-15000}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  HOSTING_PROVIDER: ${HOSTING_PROVIDER}
  DNS_PROVIDER: ${DNS_PROVIDER:-cpanel}
  REGISTRAR_PROVIDER: ${REGISTRAR_PROVIDER}
  # GoDaddy, used when REGISTRAR_PROVIDER=godaddy (see DOMAINS.md).
  GODADDY_ENV: ${GODADDY_ENV:-production}
  GODADDY_API_KEY: ${GODADDY_API_KEY:-}
  GODADDY_API_SECRET: ${GODADDY_API_SECRET:-}
  GODADDY_NAMESERVERS: ${GODADDY_NAMESERVERS:-}
  GODADDY_MAX_YEARLY_COST: ${GODADDY_MAX_YEARLY_COST:-50}
  # cPanel/WHM, used when HOSTING_PROVIDER or DNS_PROVIDER is cpanel (see HOSTING.md).
  CPANEL_HOST: ${CPANEL_HOST:-}
  CPANEL_PORT: ${CPANEL_PORT:-2087}
  CPANEL_USER: ${CPANEL_USER:-}
  CPANEL_API_TOKEN: ${CPANEL_API_TOKEN:-}
  CPANEL_TLS: ${CPANEL_TLS:-verify}
  # Plesk, used when HOSTING_PROVIDER is plesk (see HOSTING.md).
  PLESK_HOST: ${PLESK_HOST:-}
  PLESK_PORT: ${PLESK_PORT:-8443}
  PLESK_API_KEY: ${PLESK_API_KEY:-}
  PLESK_IP: ${PLESK_IP:-}
  PLESK_TLS: ${PLESK_TLS:-verify}
  # Uploaded files: the persistent volume below (local), or a private S3 bucket (s3).
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /app/storage
  # Uploaded files are checked by the clamav service below before they are kept.
  VIRUS_SCAN: ${VIRUS_SCAN:-clamav}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  # Billing rhythm. The defaults are fine; they are listed so they can be changed in one place.
  RENEWAL_LEAD_DAYS: ${RENEWAL_LEAD_DAYS:-14}
  PAST_DUE_GRACE_DAYS: ${PAST_DUE_GRACE_DAYS:-7}
  ABANDONED_ORDER_DAYS: ${ABANDONED_ORDER_DAYS:-14}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_PREFIX: ${S3_PREFIX:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?required}
      POSTGRES_DB: cirilinfo
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?required}
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cirilinfo"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  # ClamAV: checks every uploaded file. Needs about 1.5 GB of memory; it updates its virus signatures itself (edge network).
  # It takes a few minutes to start; uploads are refused (never kept unchecked) until it answers.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamavdb:/var/lib/clamav
    networks: [backend, edge]
    logging: *logging

  # One-shot: applies pending Prisma migrations, then exits. API/worker wait for it.
  migrate:
    image: ${REGISTRY:-ghcr.io/cirilinfo}/api:${IMAGE_TAG:?required}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    logging: *logging

  api:
    image: ${REGISTRY:-ghcr.io/cirilinfo}/api:${IMAGE_TAG:?required}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - storage:/app/storage
    networks: [backend, edge]
    logging: *logging

  worker:
    image: ${REGISTRY:-ghcr.io/cirilinfo}/api:${IMAGE_TAG:?required}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # edge gives outbound internet for payment, registrar, hosting-panel and email APIs.
    networks: [backend, edge]
    healthcheck:
      disable: true
    logging: *logging

  nginx:
    image: ${REGISTRY:-ghcr.io/cirilinfo}/web:${IMAGE_TAG:?required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [edge]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  storage:
  clamavdb:

networks:
  backend:
    internal: true   # no internet egress needed for DB/Redis; api/worker also join edge for outbound calls
  edge:
