# FASTPANEL's nginx → the CirilInfo app (docker-compose.fastpanel.yml), on a server shared with FASTPANEL.
# Installed as /etc/nginx/sites-enabled/cirilinfo.conf (a folder FASTPANEL's nginx.conf includes but does not manage),
# with __IPV4__ and __IPV6__ replaced by the server's addresses. See DEPLOYMENT.md, "Sharing the server with FASTPANEL".
#
# It listens exactly like FASTPANEL's own sites (address:port). A plain "listen 443" would be a different socket, and
# nginx would never choose this block for these names.

server {
  listen __IPV4__:80;
  listen [__IPV6__]:80;
  server_name cirilinfo.com www.cirilinfo.com app.cirilinfo.com admin.cirilinfo.com api.cirilinfo.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen __IPV4__:443 ssl;
  listen [__IPV6__]:443 ssl;
  http2 on;
  server_name cirilinfo.com www.cirilinfo.com app.cirilinfo.com admin.cirilinfo.com api.cirilinfo.com;

  # One certificate for the five names, issued by certbot (webroot, renewed by its timer).
  ssl_certificate     /etc/letsencrypt/live/cirilinfo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cirilinfo.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 12m;   # ticket attachments; the app's nginx and API enforce their own limits too
  access_log /var/log/nginx/cirilinfo.access.log;
  error_log  /var/log/nginx/cirilinfo.error.log warn;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Set, never appended: a visitor cannot pass in an address of their choosing.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
