# Certificates are issued by certbot (webroot) — see DEPLOYMENT.md.
# One SAN certificate covers: cirilinfo.com www app admin api.

upstream api_upstream {
  server api:3000;
  keepalive 32;
}

# HTTP → HTTPS, plus ACME challenges for certificate renewal.
server {
  listen 80 default_server;
  server_name cirilinfo.com www.cirilinfo.com app.cirilinfo.com admin.cirilinfo.com api.cirilinfo.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# www → apex
server {
  listen 443 ssl;
  http2 on;
  server_name www.cirilinfo.com;
  ssl_certificate     /etc/letsencrypt/live/cirilinfo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cirilinfo.com/privkey.pem;
  include /etc/nginx/snippets/tls.conf;
  return 301 https://cirilinfo.com$request_uri;
}

# Public website, customer portal, admin portal — same SPA build.
server {
  listen 443 ssl;
  http2 on;
  server_name cirilinfo.com app.cirilinfo.com admin.cirilinfo.com;
  ssl_certificate     /etc/letsencrypt/live/cirilinfo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cirilinfo.com/privkey.pem;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/spa.conf;
}

# API
server {
  listen 443 ssl;
  http2 on;
  server_name api.cirilinfo.com;
  ssl_certificate     /etc/letsencrypt/live/cirilinfo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cirilinfo.com/privkey.pem;
  include /etc/nginx/snippets/tls.conf;
  include /etc/nginx/snippets/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_read_timeout 60s;

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api_upstream;
  }
  # Payment webhooks: no edge rate limit (providers retry in bursts); signature-verified in the API.
  location /api/v1/webhooks/ {
    proxy_pass http://api_upstream;
  }
  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api_upstream;
  }
}
