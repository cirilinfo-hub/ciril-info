# Used instead of conf.d/cirilinfo.conf when the app shares its server with FASTPANEL (docker-compose.fastpanel.yml).
# FASTPANEL's own nginx owns ports 80/443: it terminates HTTPS for the five names and forwards plain HTTP here, to
# 127.0.0.1:8080 on the host. See DEPLOYMENT.md, "Sharing the server with FASTPANEL".

# The visitor's address, from the host's nginx. Only the Docker network can reach this container (the port is published on
# 127.0.0.1 only), so only it is trusted to say who the visitor is; the rate limits below then count real visitors.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;

# The scheme the visitor used (https), not this hop's (http): the API builds links and secure cookies from it.
map $http_x_forwarded_proto $visitor_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

upstream api_upstream {
  server api:3000;
  keepalive 32;
}

# www → apex
server {
  listen 80;
  server_name www.cirilinfo.com;
  return 301 https://cirilinfo.com$request_uri;
}

# Public website, customer portal, admin portal — same SPA build.
server {
  listen 80 default_server;
  server_name cirilinfo.com app.cirilinfo.com admin.cirilinfo.com;
  include /etc/nginx/snippets/spa.conf;
}

# API
server {
  listen 80;
  server_name api.cirilinfo.com;
  include /etc/nginx/snippets/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $visitor_proto;
  proxy_set_header X-Request-Id $request_id;
  proxy_read_timeout 60s;

  location /api/v1/auth/ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://api_upstream;
  }
  # Payment webhooks: no edge rate limit (providers retry in bursts); signature-verified in the API.
  location /api/v1/webhooks/ {
    proxy_pass http://api_upstream;
  }
  location / {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://api_upstream;
  }
}
