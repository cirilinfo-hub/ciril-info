include /etc/nginx/snippets/security-headers.conf;
# CSP: same-origin assets, Google Fonts, API calls to api.cirilinfo.com, Razorpay/Stripe checkout.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.cirilinfo.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
