# Angular SPA served for cirilinfo.com, app. and admin. (the app picks its route tree from the hostname).
# NB: nginx drops inherited add_header directives in any location that sets its own,
# so every location includes spa-headers.conf (security headers + CSP) explicitly.
root /usr/share/nginx/html;

# Hashed bundles: cache for a year. index.html: never cache, so deploys take effect immediately.
location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
  expires 1y;
  add_header Cache-Control "public, immutable";
  include /etc/nginx/snippets/spa-headers.conf;
  try_files $uri =404;
}
location / {
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/spa-headers.conf;
  try_files $uri $uri/ /index.html;
}
